<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Capture SDK - MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Document Capture</h1>
            <p>Advanced document detection with perspective correction</p>
        </div>
        
        <div class="main-content">
            <div id="statusMessage" class="status info" style="display: none;">
                Ready to capture documents
            </div>
            
            <div class="video-container">
                <video id="cameraVideo" autoplay playsinline muted></video>
                <div class="camera-hint">💡 Tap on the video to focus on your document</div>
            </div>
            
            <div class="controls">
                <button id="captureBtn" class="btn btn-success" disabled>Capture Document</button>
            </div>
            
            <div id="results" class="results"></div>
            <!-- Modal for confirmation -->
            <div id="confirmModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <span id="modalMessage"></span>
                    <div class="modal-actions">
                        <button id="modalOkBtn" class="btn btn-success">OK</button>
                        <button id="modalRetakeBtn" class="btn btn-secondary">Retake</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add OpenCV.js when ready -->
    <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <script src="document-capture-sdk.js"></script>
    <script src="main.js"></script>
</body>
</html>
